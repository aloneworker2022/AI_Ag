<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地 AI 伴侶</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景場景圖 -->
  <div id="scene" class="scene"></div>

  <!-- 睡眠/做夢狀態提示 -->
  <div id="status-badge" class="status-badge hidden"></div>

  <!-- 主舞台：對話框 + 立繪 -->
  <main class="stage">
    <div id="bubble" class="bubble hidden">
      <span id="bubble-name" class="bubble-name"></span>
      <p id="bubble-text"></p>
    </div>
    <img id="portrait" class="portrait" alt="立繪" src="">
  </main>

  <!-- 下方輸入列 -->
  <form id="input-bar" class="input-bar">
    <button type="button" id="btn-panel" class="icon-btn" title="記憶/設定">☰</button>
    <input id="msg" type="text" placeholder="說點什麼…" autocomplete="off">
    <button type="submit" id="btn-send" class="send-btn">送出</button>
  </form>

  <!-- 側邊面板：記憶 / skill / 夢境畫廊 -->
  <aside id="panel" class="panel hidden">
    <div class="panel-tabs">
      <button data-tab="memory" class="tab active">記憶</button>
      <button data-tab="dreams" class="tab">夢境</button>
      <button data-tab="skills" class="tab">Skills</button>
      <button data-tab="settings" class="tab">設定</button>
    </div>
    <div class="panel-body">
      <section id="tab-memory" class="tab-pane active">
        <div id="memory-list" class="list"></div>
        <div id="memory-editor" class="editor hidden">
          <div class="editor-path" id="editor-path"></div>
          <textarea id="editor-text"></textarea>
          <div class="editor-actions">
            <button id="editor-save">儲存</button>
            <button id="editor-delete" class="danger">刪除</button>
            <button id="editor-close">關閉</button>
          </div>
        </div>
      </section>
      <section id="tab-dreams" class="tab-pane">
        <div id="dreams-grid" class="grid"></div>
      </section>
      <section id="tab-skills" class="tab-pane">
        <div id="skills-list" class="list"></div>
      </section>
      <section id="tab-settings" class="tab-pane">
        <div class="settings-group">
          <h3>伴侶</h3>
          <label>名字
            <input id="set-companion-name" type="text" placeholder="小夜">
          </label>
        </div>

        <div class="settings-group">
          <h3>Ollama <span id="ollama-dot" class="conn-dot"></span></h3>
          <label>Base URL
            <input id="set-ollama-url" type="text" placeholder="http://100.x.x.x:11434">
          </label>
          <button type="button" id="btn-test-ollama" class="test-btn">連線並取得模型清單</button>
          <label>對話模型
            <select id="set-ollama-model" disabled>
              <option value="">請先連線取得模型清單</option>
            </select>
          </label>
          <label>記憶抽取模型
            <select id="set-ollama-extract" disabled>
              <option value="">請先連線取得模型清單</option>
            </select>
          </label>
        </div>

        <div class="settings-group">
          <h3>ComfyUI <span id="comfyui-dot" class="conn-dot"></span></h3>
          <label>Base URL
            <input id="set-comfyui-url" type="text" placeholder="http://100.x.x.x:8188">
          </label>
          <button type="button" id="btn-test-comfyui" class="test-btn">連線並取得 Checkpoint 清單</button>
          <label>Checkpoint
            <select id="set-comfyui-checkpoint" disabled>
              <option value="">請先連線取得 Checkpoint 清單</option>
            </select>
          </label>
        </div>

        <div class="settings-group">
          <h3>做夢時段</h3>
          <label>開始
            <input id="set-sleep-start" type="text" placeholder="23:00">
          </label>
          <label>結束
            <input id="set-sleep-end" type="text" placeholder="07:00">
          </label>
          <p class="hint">排程間隔（幾分鐘檢查一次）變更需重啟伺服器才會套用。</p>
        </div>

        <button id="settings-save" class="save-btn">儲存設定</button>
        <p id="settings-msg" class="hint"></p>
      </section>
    </div>
    <button id="panel-close" class="panel-close">×</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
