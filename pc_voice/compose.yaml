# Win11 電腦上的語音服務（需要 Docker Desktop + NVIDIA 顯卡）
#   tts：BreezyVoice 台灣腔語音合成  → http://<電腦IP>:8080/audio/speech
#   asr：Breeze ASR 25 台灣華語辨識 → http://<電腦IP>:8081/asr
# 啟動：docker compose up -d --build
# 換聲音：把參考錄音放到 voices/，在 .env 設定（見 .env.example），再 docker compose up -d
services:
  tts:
    build: ./BreezyVoice
    image: breezyvoice:latest
    command: api.py
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPEAKER_PROMPT_AUDIO_PATH: ${SPEAKER_PROMPT_AUDIO_PATH:-./data/example.wav}
      SPEAKER_PROMPT_TEXT_TRANSCRIPTION: ${SPEAKER_PROMPT_TEXT_TRANSCRIPTION:-在密碼學中，加密是將明文資訊改變為難以讀取的密文內容，使之不可讀的方法。只有擁有解密方法的對象，經由解密過程，才能將密文還原為正常可讀的內容。}
    volumes:
      - hf-cache:/root/.cache/huggingface/
      - ./voices:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  asr:
    build: ./asr
    image: breeze-asr:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      VOICE_TOKEN: ${VOICE_TOKEN:-}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
    volumes:
      - hf-cache:/root/.cache/huggingface/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
